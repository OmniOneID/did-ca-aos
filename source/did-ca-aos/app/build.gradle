plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
}

android {
    namespace 'org.omnione.did.ca'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    def major = 3
    def minor = 0
    def patch = 0

    defaultConfig {
        def date = new Date().format("yyyyMMdd")
        applicationId "org.omnione.did.ca"
        minSdk 26
        targetSdk 36
        versionCode major * 10000 + minor * 100 + patch
        versionName "$major.$minor.$patch"
        base.archivesName = "DID_CA_${date}_v${versionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def url = "http://192.168.3.110"
        buildConfigField "String", "TAS_URL", "\"${url}:8090\""
        buildConfigField "String", "CAS_URL", "\"${url}:8094\""
        buildConfigField "String", "API_GW_URL", "\"${url}:8093\""
        buildConfigField "String", "WALLET_URL", "\"${url}:8095\""
        buildConfigField "String", "VERIFIER_URL", "\"${url}:8092\""
        buildConfigField "String", "DEMO_URL", "\"${url}:8099\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions += "env"
    productFlavors {
        prod {
            dimension "env"
        }
        // E2E automation build. Same applicationId as prod so CAS registration keeps working;
        // src/qa/AndroidManifest.xml exports the QR issuance entry points so tests can inject
        // a scanned payload with `am start --es extra_payload`.
        qa {
            dimension "env"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation libs.appcompat
    implementation libs.material
    implementation libs.core.splashscreen
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.viewpager2
    implementation libs.gridlayout
    implementation libs.activity
    implementation libs.fragment
    implementation libs.recyclerview
    implementation libs.constraintlayout

    implementation libs.gson
    implementation libs.zxing.android.embedded
    implementation libs.bitcoinj.core
    implementation libs.biometric

    api libs.room.runtime

    implementation libs.spongycastle.core
    implementation libs.spongycastle.prov

    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    implementation libs.nimbus.jose.jwt

    implementation libs.upokecenter.cbor

    implementation files('libs/proximity-holder-1.0.0.aar')
}